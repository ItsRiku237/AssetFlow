<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="410" rx="28" fill="#070b16" stroke="#334155"/>
<text x="50" y="50" font-family="Inter,Arial" font-size="25" font-weight="700" fill="#f8fafc">Asset Lifecycle</text>
<text x="50" y="77" font-family="Inter,Arial" font-size="14" fill="#94a3b8">The asset moves through clear states instead of random status changes.</text>
<g font-family="Inter,Arial">
<rect x="55" y="145" width="180" height="88" rx="18" fill="#111827" stroke="#475569"/><text x="145" y="179" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">AVAILABLE</text><text x="145" y="203" text-anchor="middle" font-size="12" fill="#94a3b8">Ready to assign</text>
<rect x="275" y="145" width="180" height="88" rx="18" fill="#111827" stroke="#475569"/><text x="365" y="179" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">ASSIGNED</text><text x="365" y="203" text-anchor="middle" font-size="12" fill="#94a3b8">With an employee</text>
<rect x="495" y="145" width="210" height="88" rx="18" fill="#111827" stroke="#475569"/><text x="600" y="179" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">RETURN REQUESTED</text><text x="600" y="203" text-anchor="middle" font-size="12" fill="#94a3b8">Waiting for review</text>
<rect x="745" y="145" width="180" height="88" rx="18" fill="#111827" stroke="#475569"/><text x="835" y="179" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">IN REPAIR</text><text x="835" y="203" text-anchor="middle" font-size="12" fill="#94a3b8">Being serviced</text>
<rect x="965" y="145" width="180" height="88" rx="18" fill="url(#g)" opacity=".85"/><text x="1055" y="179" text-anchor="middle" font-size="18" font-weight="700" fill="white">RETIRED</text><text x="1055" y="203" text-anchor="middle" font-size="12" fill="white">No normal assignment</text>
</g>
<path d="M235 189H270M455 189H490M705 189H740M925 189H960" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/>
<path d="M835 238V300H145V238" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/>
<text x="490" y="330" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#94a3b8">Return can lead to AVAILABLE or IN REPAIR. AVAILABLE can be RETIRED.</text>
</svg>