<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="raf-g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>
</defs>

<rect width="1200" height="430" rx="28" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Who can do what?</text>
<text x="55" y="82" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">Everyone signs in — the role decides the workspace.</text>

<!-- Sign In box -->
<rect x="70" y="128" width="250" height="72" rx="18" fill="#111827" stroke="#475569" stroke-width="1.5"/>
<text x="195" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Sign In</text>

<!-- Arrow: Sign In → Role Check -->
<line x1="322" y1="164" x2="424" y2="164" stroke="#67e8f9" stroke-width="3"/>
<polygon points="424,157 438,164 424,171" fill="#67e8f9"/>

<!-- Role Check box -->
<rect x="438" y="104" width="220" height="120" rx="20" fill="url(#raf-g)" opacity=".85"/>
<text x="548" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Role Check</text>
<text x="548" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e0f2fe">Super Admin · Admin · Employee</text>

<!-- Arrow: Role Check → Super Admin (top-right diagonal) -->
<line x1="658" y1="130" x2="762" y2="90" stroke="#67e8f9" stroke-width="2.5"/>
<polygon points="755,81 768,88 758,97" fill="#67e8f9"/>

<!-- Arrow: Role Check → Admin (straight right) -->
<line x1="658" y1="164" x2="762" y2="164" stroke="#67e8f9" stroke-width="2.5"/>
<polygon points="762,157 776,164 762,171" fill="#67e8f9"/>

<!-- Arrow: Role Check → Employee (bottom-right diagonal) -->
<line x1="658" y1="198" x2="762" y2="238" stroke="#67e8f9" stroke-width="2.5"/>
<polygon points="755,231 768,240 758,249" fill="#67e8f9"/>

<!-- Role boxes -->
<rect x="776" y="53"  width="330" height="72" rx="18" fill="#111827" stroke="#475569" stroke-width="1.5"/>
<text x="941" y="82"  text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Super Admin</text>
<text x="941" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Admins + full oversight</text>

<rect x="776" y="128" width="330" height="72" rx="18" fill="#111827" stroke="#475569" stroke-width="1.5"/>
<text x="941" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Admin</text>
<text x="941" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Assets + employees + workflows</text>

<rect x="776" y="203" width="330" height="72" rx="18" fill="#111827" stroke="#475569" stroke-width="1.5"/>
<text x="941" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Employee</text>
<text x="941" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">My assets + requests + returns</text>

<!-- Summary bar -->
<rect x="210" y="308" width="780" height="70" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="600" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#67e8f9">Simple rule</text>
<text x="600" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#cbd5e1">Role controls the pages, actions and data each user can access — enforced server-side.</text>
</svg>
