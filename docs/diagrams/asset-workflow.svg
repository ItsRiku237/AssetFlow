<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="390" rx="28" fill="#070b16" stroke="#334155"/>
<text x="50" y="50" font-family="Inter,Arial" font-size="25" font-weight="700" fill="#f8fafc">How ADP AssetHub Works</text>
<text x="50" y="77" font-family="Inter,Arial" font-size="14" fill="#94a3b8">Think of every asset as a tracked item with an owner, status and history.</text>
<g font-family="Inter,Arial" font-size="14" font-weight="700" fill="#f8fafc">
<rect x="55" y="135" width="190" height="86" rx="18" fill="#111827" stroke="#475569"/><text x="150" y="169" text-anchor="middle">1. Add Asset</text><text x="150" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Laptop / Monitor / Phone</text>
<rect x="305" y="135" width="190" height="86" rx="18" fill="#111827" stroke="#475569"/><text x="400" y="169" text-anchor="middle">2. Assign</text><text x="400" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Employee gets custody</text>
<rect x="555" y="135" width="190" height="86" rx="18" fill="#111827" stroke="#475569"/><text x="650" y="169" text-anchor="middle">3. Use &amp; Track</text><text x="650" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Status + history + audit</text>
<rect x="805" y="135" width="190" height="86" rx="18" fill="url(#g)" opacity=".85"/><text x="900" y="169" text-anchor="middle">4. Return / Repair</text><text x="900" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="white">Then back to service</text>
</g>
<path d="M245 178H300M495 178H550M745 178H800" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/>
<path d="M900 225V285H150V225" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/>
<text x="525" y="315" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#94a3b8">When the asset becomes available again, the cycle can repeat.</text>
</svg>